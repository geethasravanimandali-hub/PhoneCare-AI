# Server Configuration
server.port=${PORT:8080}

# Application Details
spring.application.name=PhoneCare-AI

# Logging
logging.level.com.phonecare=DEBUG
logging.level.org.springframework.web=INFO

# AI Agent Configuration
ai.api.key=${AI_API_KEY:}
ai.model=gemini-1.5-flash
ai.timeout.seconds=10

# ML Model & Prediction Service Configuration
ml.enabled=${ML_ENABLED:true}
ml.service.url=${ML_SERVICE_URL:}
ml.python.path=${PYTHON_BIN:}
ml.models.dir=${MODELS_DIR:}
